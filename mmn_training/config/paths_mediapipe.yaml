# Placeholders — set these before running:
#   <MODEL_PATH>   : full path to the MediaPipe "pose_landmarker_full.task" model file.
#   <PROJECT_ROOT> : your local checkout of the Micro-Action repository
#                    (the directory that contains "Micro-action skeleton/").
model_path: <MODEL_PATH>
out_root: "<PROJECT_ROOT>/Micro-action skeleton"

pose:
  stride: 1
  brightness: 0.0
  contrast: 1.0
  roi: [0, 0, 1, 1]
  save_dtype: float32
  num_poses: 1
  min_pose_detection_confidence: 0.5
  min_pose_presence_confidence: 0.5
  min_tracking_confidence: 0.5
