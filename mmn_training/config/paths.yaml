# ===== Project paths =====
# Placeholders — set these before running:
#   <PROJECT_ROOT> : your local checkout of the Micro-Action repository
#                    (the directory that contains "Micro-action skeleton/").
#   <MODEL_PATH>   : full path to the MediaPipe "pose_landmarker_full.task" model file.
base_dir: <PROJECT_ROOT>/Micro-action skeleton/MMN
model_path: <MODEL_PATH>

# ===== Train Data paths for MMA (separate project — example only) =====
# video_dir: /home/woody/iwso/<OTHER_ACCOUNT>/scratch/MMA-52/train
# out_root: /home/woody/iwso/<OTHER_ACCOUNT>/scratch/MMA-52/npy_out

# ===== Train Data paths for MA =====
video_dir: <PROJECT_ROOT>/Micro-action skeleton/MMN/data/MA52_real/train
out_root: <PROJECT_ROOT>/Micro-action skeleton/MMN/npy_out_ma

# ===== Vali Data paths for MMA (separate project — example only) =====
# video_dir: /home/woody/iwso/<OTHER_ACCOUNT>/scratch/MMA-52/val
# out_root: /home/woody/iwso/<OTHER_ACCOUNT>/scratch/MMA-52/npy_out

# ===== Vali Data paths for MA (separate project — example only) =====
# video_dir: /home/hpc/iwso/<OTHER_ACCOUNT>/<OTHER_PROJECT>/data/MA52_real/val
# out_root: /home/woody/iwso/<OTHER_ACCOUNT>/<OTHER_PROJECT>/npy_out

log_dir: <PROJECT_ROOT>/Micro-action skeleton/MMN/logs

# ===== Pose extraction defaults =====
pose:
  stride: 1
  roi: [0, 0, 1, 1]        # normalized ROI (xmin, ymin, xmax, ymax)
  brightness: 0.0
  contrast: 1.0
  save_dtype: float16

# MA52 Root directory where extracted pose npy files are stored
npy_root: <PROJECT_ROOT>/Micro-action skeleton/MMN/npy_out_ma_neutralized

# MMA52 Root directory where extracted pose npy files are stored
mma_npy_root: <PROJECT_ROOT>/Micro-action skeleton/MMN/npy_out_mma

# Root directory for datasets / annotations / output pkls
data_root: <PROJECT_ROOT>/Micro-action skeleton/MMN/data
